version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: onshape-cad-db
    environment:
      POSTGRES_USER: cad_user
      POSTGRES_PASSWORD: cad_password
      POSTGRES_DB: cad_visualizer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cad_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
